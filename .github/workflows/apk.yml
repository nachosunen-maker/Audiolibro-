name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Prepare debug keystore
        run: |
          set -euo pipefail
          if [ -f debug.keystore ] && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "OK: Valid existing debug.keystore found; reusing."
          elif [ -s debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "OK: debug.keystore decoded and verified."
          else
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run Kotlin unit and Robolectric tests
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build and verify signed debug APK + ARM64 native TTS assets
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:reportOfflineApkSizes --no-daemon --stacktrace
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK not found or empty at $APK_PATH"
            exit 1
          fi
          python3 - "$APK_PATH" <<'PYEOF'
          import sys, zipfile
          apk = sys.argv[1]
          required = [
              "lib/arm64-v8a/libsherpa-onnx-jni.so",
              "lib/arm64-v8a/libpiper-phonemize-jni.so",
              "lib/arm64-v8a/libonnxruntime.so",
              "assets/tts/vits-piper-es_ES-sharvard-medium/es_ES-sharvard-medium.onnx",
              "assets/tts/vits-piper-es_ES-sharvard-medium/es_ES-sharvard-medium.onnx.json",
              "assets/tts/vits-piper-es_ES-sharvard-medium/tokens.txt",
              "assets/tts/vits-piper-es_ES-sharvard-medium/espeak-ng-data/es_dict",
              "assets/tts/vits-piper-es_ES-sharvard-medium/espeak-ng-data/phontab",
              "assets/tts/vits-piper-es_ES-sharvard-medium/espeak-ng-data/phonindex",
              "assets/tts/vits-piper-es_ES-sharvard-medium/espeak-ng-data/phondata",
              "assets/tts/vits-piper-es_ES-sharvard-medium/espeak-ng-data/intonations",
          ]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              missing = [r for r in required if r not in names]
              if missing:
                  raise SystemExit(f"Missing required offline ARM64 TTS artifacts in APK: {missing}")
              print(f"OK: Verified all {len(required)} required ARM64 native libraries and SHARVARD assets inside {apk}.")
          PYEOF
          echo "OK: APK generated successfully ($(wc -c < "$APK_PATH") bytes)"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          echo "OK: APK signature verified successfully."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audiolibro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
