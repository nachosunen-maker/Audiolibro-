name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          set -euo pipefail
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create and validate google-services.json
        run: |
          set -euo pipefail
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "545883078205",
              "project_id": "gen-lang-client-0560185680",
              "storage_bucket": "gen-lang-client-0560185680.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:545883078205:android:0d185b1aff45c9aa2b3454",
                  "android_client_info": {
                    "package_name": "com.aistudio.audiolibro.vqprmz"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDj1Tp2XDK7xB66aeWzVe0wwTsm8W08VDA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          python3 -c "
          import json
          with open('app/google-services.json') as f:
              data = json.load(f)
          pkg = data['client'][0]['client_info']['android_client_info']['package_name']
          assert pkg == 'com.aistudio.audiolibro.vqprmz', f'Unexpected package name: {pkg}'
          print('OK: app/google-services.json is valid and matches package com.aistudio.audiolibro.vqprmz')
          "

      - name: Prepare debug keystore
        run: |
          set -euo pipefail
          if [ -f debug.keystore ] && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "OK: Valid existing debug.keystore found; reusing."
          elif [ -s debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "OK: debug.keystore decoded and verified."
          else
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Build signed debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK not found or empty at $APK_PATH"
            exit 1
          fi
          echo "OK: APK generated successfully ($(wc -c < "$APK_PATH") bytes)"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found in build-tools; skipping apksigner verify."
          else
            echo "Using apksigner: $APKSIGNER"
            "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
            echo "OK: APK signature verified successfully."
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audiolibro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
