name: Deploy AudioLibreaMe Web to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Test, Build & Deploy Web PWA (Firebase Hosting)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync local WASM & Piper ONNX runtime assets
        run: npm run sync-assets

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run automated Vitest suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (audiolibreame)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUDIOLIBREAME }}
          projectId: audiolibreame
          channelId: live
          entryPoint: ./web
