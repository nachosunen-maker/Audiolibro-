name: Deploy AudioLibreaMe Web to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Test, Build & Deploy Web PWA (Firebase Hosting)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync & verify local WASM + Piper ONNX runtime assets
        run: npm run sync-assets

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run automated Vitest suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify production dist bundle
        run: npm run verify-dist

      - name: Verify Workload Identity Provider variable is configured
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "ERROR: Falta la variable de repositorio GCP_WORKLOAD_IDENTITY_PROVIDER en GitHub Actions."
            echo "Crea la variable en Settings -> Secrets and variables -> Actions -> Variables."
            echo "Formato esperado: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL_ID>/providers/<PROVIDER_ID>"
            exit 1
          fi
          case "$WIF_PROVIDER" in
            projects/*/locations/global/workloadIdentityPools/*/providers/*)
              echo "Proveedor OIDC configurado con formato válido."
              ;;
            *)
              echo "ERROR: El formato de GCP_WORKLOAD_IDENTITY_PROVIDER no es válido."
              echo "Formato esperado: projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL_ID>/providers/<PROVIDER_ID>"
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud via Workload Identity Federation (OIDC)
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: firebase-adminsdk-fbsvc@audiolibreame.iam.gserviceaccount.com
          project_id: audiolibreame
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Verify Firebase Hosting API access and default site
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          if [ -z "$GCP_ACCESS_TOKEN" ]; then
            echo "ERROR: google-github-actions/auth@v3 no devolvió un access_token."
            exit 1
          fi

          API_URL="https://firebasehosting.googleapis.com/v1beta1/projects/audiolibreame/sites"
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "$API_URL")

          echo "Firebase Hosting API GET /projects/audiolibreame/sites -> HTTP ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR real devuelto por Firebase Hosting API (HTTP ${HTTP_CODE}):"
            cat "$BODY_FILE"
            echo ""
            rm -f "$BODY_FILE"
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync(process.argv[1], "utf8");
            const data = JSON.parse(raw);
            const sites = Array.isArray(data.sites) ? data.sites : [];

            console.log(`Sitios devueltos por Firebase Hosting (${sites.length}):`);
            for (const s of sites) {
              console.log(` - name=${s.name || "(sin nombre)"} | type=${s.type || "(sin tipo)"} | defaultUrl=${s.defaultUrl || "(sin url)"}`);
            }

            const defaultSite = sites.find((s) => {
              const name = String(s.name || "");
              const siteId = name.split("/").pop();
              return s.type === "DEFAULT_SITE" && siteId === "audiolibreame";
            });

            if (!defaultSite) {
              console.error("ERROR: Falta el sitio predeterminado (type=DEFAULT_SITE, id=audiolibreame) en Firebase Hosting.");
              process.exit(1);
            }

            console.log(`Sitio predeterminado confirmado: ${defaultSite.name} (${defaultSite.defaultUrl || "https://audiolibreame.web.app"})`);
          ' "$BODY_FILE"

          rm -f "$BODY_FILE"

      - name: Deploy to Firebase Hosting (audiolibreame)
        run: npx --yes firebase-tools@15.37.0 deploy --only hosting --project audiolibreame --non-interactive --debug

      - name: Verify live Firebase Hosting deployment
        run: |
          BASE_URL="https://audiolibreame.web.app"

          check_http_200() {
            local path="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}${path}")
            echo "CHECK ${path} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "ERROR: ${BASE_URL}${path} devolvió HTTP ${code} (esperado 200)."
              exit 1
            fi
          }

          HTML=$(curl -fsSL "${BASE_URL}/")
          echo "$HTML" | grep -q "AudioLibreaMe" || {
            echo "ERROR: ${BASE_URL}/ no devuelve la aplicación AudioLibreaMe."
            exit 1
          }
          echo "$HTML" | grep -qi "Site Not Found" && {
            echo "ERROR: ${BASE_URL}/ sigue mostrando Site Not Found."
            exit 1
          }

          HEADERS=$(curl -fsSI "${BASE_URL}/")
          echo "$HEADERS" | grep -qi "cross-origin-opener-policy: same-origin" || {
            echo "ERROR: Falta cabecera Cross-Origin-Opener-Policy: same-origin."
            exit 1
          }
          echo "$HEADERS" | grep -qi "cross-origin-embedder-policy: credentialless" || {
            echo "ERROR: Falta cabecera Cross-Origin-Embedder-Policy: credentialless."
            exit 1
          }

          check_http_200 "/manifest.webmanifest"
          check_http_200 "/sw.js"
          check_http_200 "/assets/models/es_ES-sharvard-medium.onnx.json"
          check_http_200 "/wasm/piper_phonemize.wasm"
          check_http_200 "/wasm/ort-wasm-simd-threaded.wasm"
          check_http_200 "/libro/verificacion-spa"

          ONNX_HEADERS=$(curl -fsSI "${BASE_URL}/assets/models/es_ES-sharvard-medium.onnx")
          echo "$ONNX_HEADERS" | grep -qi "content-length: 76682531" || {
            echo "ERROR: El modelo ONNX en Hosting no tiene content-length: 76682531."
            exit 1
          }

          echo "OK: AudioLibreaMe verificado en vivo en ${BASE_URL}"
